server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        # Always revalidate the HTML entry so new deploys are picked up immediately.
        add_header Cache-Control "no-cache";
    }

    # nginx's bundled mime.types has no .webmanifest entry, and iOS/Android
    # ignore a manifest served as octet-stream. A scoped `types {}` avoids
    # replacing the inherited MIME map for the whole server.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Long-term cache for hashed static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
