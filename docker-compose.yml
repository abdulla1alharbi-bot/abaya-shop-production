version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: abaya_shop
      POSTGRES_USER: abaya
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only. This used to be "5432:5432", which on a VPS with ufw
      # inactive means the database is reachable from the internet behind one
      # password. The api container reaches Postgres over the compose network by
      # service name, so nothing in the stack needs the published port at all.
      # To connect a client from your laptop, tunnel it over SSH instead:
      #   ssh -L 5432:127.0.0.1:5432 root@<server>
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abaya -d abaya_shop"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://abaya:${DB_PASSWORD}@postgres:5432/abaya_shop
      NODE_ENV: production
      PORT: 3001
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # Set to "true" once the site is served over HTTPS (adds Secure flag to auth cookies).
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      # Number of reverse proxies in front of the API. Leave 0 while the API is
      # published directly; set to 1 the moment TLS is terminated in front of it,
      # otherwise every request looks like it came from the proxy and all staff
      # share a single login rate-limit bucket.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      # Outbound email for the nightly owner report. Leave SMTP_HOST empty to
      # disable sending entirely; the app then shows "email not set up" in Settings.
      # WHO gets the report and WHEN is edited in the app, not here.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      # Persist uploaded model images across container rebuilds/redeploys.
      # Served by the API at /uploads (see app.ts); written to /app/uploads/models.
      - uploads:/app/uploads
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  pgdata:
  uploads:
